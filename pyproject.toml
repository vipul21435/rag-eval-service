[project]
name = "rag-eval-service"
dynamic = ["version"]
description = "FastAPI RAG service with local embeddings, FAISS + BM25 hybrid retrieval and a retrieval evaluation suite"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "langchain-text-splitters>=0.3",
    "pdfminer.six>=20231228",
]

[project.optional-dependencies]
# Parsers for office formats; PDF, TXT and Markdown work without them.
documents = [
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "version.py"

[tool.hatch.build.targets.wheel]
only-include = ["core", "features", "utils", "config.py", "api_router.py", "version.py"]

[tool.uv]
# torch on PyPI pulls CUDA wheels on Linux; use the CPU-only index there.
# macOS and Windows PyPI wheels are already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -p no:langsmith"
