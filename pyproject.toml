[project]
name = "recallmcp"
dynamic = ["version"]
description = "Local-first RAG service: FastAPI API over local embeddings, FAISS + BM25 hybrid retrieval and cross-encoder reranking"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Vipul Jha" }]
keywords = ["rag", "retrieval", "faiss", "bm25", "fastapi", "mcp"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "pdfminer.six>=20231228",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
# The neural embedder and the cross-encoder reranker (torch, about 1 GB on
# disk). Without it, RAG_EMBEDDING_PROVIDER=hash and RAG_RERANK_METHOD=none
# run the service with deterministic lexical vectors and no model download.
neural = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
# Parsers for office formats; PDF, TXT and Markdown work without them.
documents = [
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "httpx2>=2.0",  # what starlette 1.x's TestClient prefers; httpx alone warns
    "ruff>=0.12",
    "mypy>=1.14",
    "types-requests>=2.31",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/vipul21435/recallmcp"
Repository = "https://github.com/vipul21435/recallmcp"
Upstream = "https://github.com/weiwill88/Local_Pdf_Chat_RAG"

[project.scripts]
recallmcp = "ragsvc.__main__:main"

[tool.hatch.version]
path = "src/ragsvc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ragsvc"]

[tool.uv]
# torch on PyPI pulls CUDA wheels on Linux; use the CPU-only index there.
# macOS and Windows PyPI wheels are already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:langsmith"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "BLE",  # blind except
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "PIE",  # misc lints
    "T20",  # no print statements
    "RET",  # return consistency
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]
"examples/*" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["src", "tests", "examples"]
mypy_path = "src"
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "faiss",
    "faiss.*",
    "rank_bm25",
    "pdfminer.*",
    "docx",
    "pptx",
    "pandas",
    "sentence_transformers",
    "sentence_transformers.*",
]
ignore_missing_imports = true
